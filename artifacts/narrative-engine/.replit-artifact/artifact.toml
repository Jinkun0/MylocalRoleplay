kind = "web"
previewPath = "/"
title = "Narrative Simulation Engine"
version = "1.0.0"
id = "artifacts/narrative-engine"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25782

[services.development]
run = "pnpm --filter @workspace/narrative-engine run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/narrative-engine", "run", "build" ]
serve = "static"
publicDir = "artifacts/narrative-engine/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25782"
BASE_PATH = "/"
